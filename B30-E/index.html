<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>WorldSkills Shanghai</title>

<!-- Variable font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #headline {
    font-family: "Inter", sans-serif;
    font-size: 6vw;
    color: #e2e8f0;
    white-space: nowrap;
  }

  #headline span {
    display: inline-block;
  }
</style>
</head>

<body>

<h1 id="headline"></h1>

<script>
  const text = "WorldSkills Shanghai";
  const headline = document.getElementById("headline");

  const minWeight = 100;
  const maxWeight = 900;
  const maxDistance = 180;

  // Create one span for each letter
  const letters = [...text].map(letter => {
    const span = document.createElement("span");

    span.textContent = letter === " " ? "\u00A0" : letter;

    headline.appendChild(span);

    return span;
  });


  let mouseX = -1000;
  let mouseY = -1000;


  // Get mouse position
  document.addEventListener("mousemove", event => {
    mouseX = event.clientX;
    mouseY = event.clientY;
  });


  function animate() {

    letters.forEach(letter => {

      // Find the center of the letter
      const box = letter.getBoundingClientRect();

      const centerX = box.left + box.width / 2;
      const centerY = box.top + box.height / 2;


      // Calculate distance from mouse
      const distance = Math.hypot(
        mouseX - centerX,
        mouseY - centerY
      );


      // Convert distance into a value between 0 and 1
      let strength = 1 - distance / maxDistance;

      strength = Math.max(0, Math.min(1, strength));


      // Calculate the font weight
      const weight =
        minWeight +
        strength * (maxWeight - minWeight);


      // Change letter thickness
      letter.style.fontVariationSettings =
        `"wght" ${weight}`;
    });


    // Continue animation
    requestAnimationFrame(animate);
  }


  animate();
</script>

</body>
</html>
