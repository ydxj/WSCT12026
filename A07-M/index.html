<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A07-M: Skeleton Loading Cards</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grid">

  <!-- Reference: fully-styled loaded card -->
  <article class="card">
    <div class="img"></div>
    <span class="chip">News</span>
    <h2 class="title">The Morning Wire launches its new edition</h2>
    <h2 class="title title--sub">Readers react to the redesign</h2>
    <p class="line">Lorem ipsum dolor sit amet consectetur.</p>
    <p class="line">Adipiscing elit sed do eiusmod tempor.</p>
    <p class="line line--short">Ut enim ad minim.</p>
  </article>

  <!-- Skeleton card 1 -->
  <article class="card">
    <div class="sk sk--image"></div>
    <span class="sk sk--chip"></span>
    <div class="sk sk--line sk--line-lg"></div>
    <div class="sk sk--line sk--line-lg sk--w70"></div>
    <div class="sk sk--line"></div>
    <div class="sk sk--line"></div>
    <div class="sk sk--line sk--w40"></div>
  </article>

  <!-- Skeleton card 2 -->
  <article class="card">
    <div class="sk sk--image"></div>
    <span class="sk sk--chip"></span>
    <div class="sk sk--line sk--line-lg"></div>
    <div class="sk sk--line sk--line-lg sk--w70"></div>
    <div class="sk sk--line"></div>
    <div class="sk sk--line"></div>
    <div class="sk sk--line sk--w40"></div>
  </article>

</div>
</body>
</html>
