<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A25-E: Button</title>
<style>
  html, body{
    height:100%;
    margin:0;
    background:#f0f0f0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  button{
    font-family:system-ui,sans-serif;
    font-size:25px;
    font-weight:bold;
    padding:25px 50px;
    color:#725ac1;
    background:transparent;
    border:2px solid #725ac1;
    border-radius:15px;
    cursor:pointer;

    box-shadow: inset 0 -100px 0 0 transparent;
    transition: box-shadow .3s ease, color .3s ease, transform .3s ease;
  }

  button:hover{
    box-shadow: inset 0 -100px 0 0 #725ac1;
    color:#fff;
  }

  button:active{
    transform:scale(0.9);
  }
</style>
</head>
<body>
  <button>Button</button>
</body>
</html>
