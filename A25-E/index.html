<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f0f0f0;
  }

  .btn {
    position: relative;
    overflow: hidden;
    z-index: 1;

    font-size: 25px;
    font-weight: bold;
    padding: 25px 50px;
    color: #725ac1;
    background-color: transparent;
    border: 2px solid #725ac1;
    border-radius: 15px;
    cursor: pointer;

    transition: color 0.3s ease, transform 0.3s ease;
  }

  /* Straight-edged fill, clipped to the button's rounded outline by overflow:hidden */
  .btn::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -100%;
    height: 100%;
    background-color: #725ac1;
    z-index: -1;
    transition: bottom 0.3s ease;
  }

  .btn:hover {
    color: #ffffff;
  }

  .btn:hover::before {
    bottom: 0;
  }

  .btn:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
  <button class="btn">Button</button>
</body>
</html>
